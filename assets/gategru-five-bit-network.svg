<svg xmlns="http://www.w3.org/2000/svg" width="2280" height="1130" viewBox="0 0 2280 1130" role="img" aria-labelledby="title desc">
<title id="title">RecurBool：与pipeline一致的5bit编码网络结构</title>
<desc id="desc">采用统一蓝色方框、显式分支和核心公式。字符编码和旧状态分别进入输入与循环映射，产生r、z、n三组分支。重置门作用于候选的循环仿射结果；更新门控制旧状态与候选混合；旧状态还有一条底部直接通路。混合结果编码为五位状态，送往读出与五位分数编码，同时作为下一步状态保存。该图与量化、逻辑编译和时序反馈pipeline互补，不重复离线转换和门展开示意。</desc>
<defs>
<marker id="blue" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#003fbd"/></marker>
</defs>
<rect width="2280" height="1130" fill="white"/>
<g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif">
<text x="45" y="54" fill="#142033" font-size="39" font-weight="600" text-anchor="start">RecurBool：5bit 编码网络结构</text>
<text x="2230" y="54" fill="#627083" font-size="31" font-weight="400" text-anchor="end">与 pipeline 一致：W5S5-I8</text>
<path d="M280,380 H385" fill="none" stroke="#003fbd" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M280,747 H330 V690 H385" fill="none" stroke="#003fbd" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M725,395 H775 V285 H825" fill="none" stroke="#003fbd" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M555,300 V125 H1560 V200" fill="none" stroke="#003fbd" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M725,645 H825" fill="none" stroke="#003fbd" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M1035,370 V530" fill="none" stroke="#003fbd" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M1560,370 V590" fill="none" stroke="#003fbd" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M1245,625 H1290 V670 H1350" fill="none" stroke="#003fbd" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M163,835 V925 H1560 V820" fill="none" stroke="#003fbd" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M1770,705 H1820 V635 H1870" fill="none" stroke="#003fbd" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<circle cx="1820" cy="705" r="4.4" fill="#003fbd"/>
<path d="M1820,705 V925" fill="none" stroke="#003fbd" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M2230,635 H2260" fill="none" stroke="#003fbd" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="45" y="300" width="235" height="160" rx="12" fill="#fbfdff" stroke="#003fbd" stroke-width="1.8"/>
<text x="162" y="346" fill="#003fbd" font-size="35" font-weight="600" text-anchor="middle">当前字符</text>
<text x="162" y="402" text-anchor="middle" fill="#142033" font-family="Times New Roman, STIX Two Math, Cambria Math, serif" font-size="31">c<tspan baseline-shift="sub" font-size="70%">t</tspan> ∈ {0,…,26}</text>
<text x="162" y="438" fill="#627083" font-size="27" font-weight="400" text-anchor="middle">字符编号 · 5bit</text>
<rect x="45" y="660" width="235" height="175" rx="12" fill="#fbfdff" stroke="#003fbd" stroke-width="1.8"/>
<text x="162" y="706" fill="#003fbd" font-size="35" font-weight="600" text-anchor="middle">旧状态</text>
<text x="162" y="755" text-anchor="middle" fill="#142033" font-family="Times New Roman, STIX Two Math, Cambria Math, serif" font-size="30">k<tspan baseline-shift="sub" font-size="70%">t−1</tspan> · 256 × 5bit</text>
<text x="162" y="803" text-anchor="middle" fill="#142033" font-family="Times New Roman, STIX Two Math, Cambria Math, serif" font-size="30">ĥ<tspan baseline-shift="sub" font-size="70%">t−1</tspan> = L<tspan baseline-shift="sub" font-size="70%">h</tspan>[k<tspan baseline-shift="sub" font-size="70%">t−1</tspan>]</text>
<rect x="385" y="300" width="340" height="430" rx="12" fill="#fbfdff" stroke="#003fbd" stroke-width="1.8"/>
<text x="555" y="351" fill="#003fbd" font-size="34" font-weight="600" text-anchor="middle">输入与循环映射</text>
<text x="555" y="421" text-anchor="middle" fill="#142033" font-family="Times New Roman, STIX Two Math, Cambria Math, serif" font-size="35">a<tspan baseline-shift="sub" font-size="70%">t</tspan> = Input(c<tspan baseline-shift="sub" font-size="70%">t</tspan>)</text>
<text x="555" y="484" text-anchor="middle" fill="#142033" font-family="Times New Roman, STIX Two Math, Cambria Math, serif" font-size="34">b<tspan baseline-shift="sub" font-size="70%">t</tspan> = Recur(k<tspan baseline-shift="sub" font-size="70%">t−1</tspan>)</text>
<text x="555" y="572" fill="#142033" font-size="31" font-weight="400" text-anchor="middle">两组结果各 768 维</text>
<text x="555" y="627" fill="#142033" font-size="31" font-weight="400" text-anchor="middle">拆为 r / z / n 三组</text>
<text x="555" y="685" fill="#627083" font-size="29" font-weight="400" text-anchor="middle">参数使用 5bit 编码</text>
<text x="555" y="775" fill="#627083" font-size="29" font-weight="400" text-anchor="middle">权重 / 偏置码：5bit</text>
<rect x="825" y="200" width="420" height="170" rx="12" fill="#fbfdff" stroke="#003fbd" stroke-width="1.8"/>
<text x="1035" y="247" fill="#003fbd" font-size="35" font-weight="600" text-anchor="middle">Reset：候选控制</text>
<text x="1035" y="306" text-anchor="middle" fill="#142033" font-family="Times New Roman, STIX Two Math, Cambria Math, serif" font-size="35">r<tspan baseline-shift="sub" font-size="70%">t</tspan> = Q<tspan baseline-shift="sub" font-size="70%">5</tspan>[σ(a<tspan baseline-shift="sub" font-size="70%">r</tspan> + b<tspan baseline-shift="sub" font-size="70%">r</tspan>)]</text>
<text x="1035" y="347" fill="#627083" font-size="28" font-weight="400" text-anchor="middle">5bit 门值 · 32级</text>
<rect x="1350" y="200" width="420" height="170" rx="12" fill="#fbfdff" stroke="#003fbd" stroke-width="1.8"/>
<text x="1560" y="247" fill="#003fbd" font-size="35" font-weight="600" text-anchor="middle">Update：保留比例</text>
<text x="1560" y="306" text-anchor="middle" fill="#142033" font-family="Times New Roman, STIX Two Math, Cambria Math, serif" font-size="35">z<tspan baseline-shift="sub" font-size="70%">t</tspan> = Q<tspan baseline-shift="sub" font-size="70%">5</tspan>[σ(a<tspan baseline-shift="sub" font-size="70%">z</tspan> + b<tspan baseline-shift="sub" font-size="70%">z</tspan>)]</text>
<text x="1560" y="347" fill="#627083" font-size="28" font-weight="400" text-anchor="middle">5bit 门值 · 32级</text>
<rect x="825" y="530" width="420" height="190" rx="12" fill="#fbfdff" stroke="#003fbd" stroke-width="1.8"/>
<text x="1035" y="578" fill="#003fbd" font-size="35" font-weight="600" text-anchor="middle">候选状态</text>
<text x="1035" y="638" text-anchor="middle" fill="#142033" font-family="Times New Roman, STIX Two Math, Cambria Math, serif" font-size="31">n̂<tspan baseline-shift="sub" font-size="70%">t</tspan> = Q<tspan baseline-shift="sub" font-size="70%">5</tspan>[tanh(a<tspan baseline-shift="sub" font-size="70%">n</tspan> + r<tspan baseline-shift="sub" font-size="70%">t</tspan> ⊙ b<tspan baseline-shift="sub" font-size="70%">n</tspan>)]</text>
<text x="1035" y="687" fill="#627083" font-size="28" font-weight="400" text-anchor="middle">候选编码：256 × 5bit</text>
<rect x="1350" y="590" width="420" height="230" rx="12" fill="#fbfdff" stroke="#003fbd" stroke-width="1.8"/>
<text x="1560" y="638" fill="#003fbd" font-size="35" font-weight="600" text-anchor="middle">状态混合与5bit编码</text>
<text x="1560" y="691" text-anchor="middle" fill="#142033" font-family="Times New Roman, STIX Two Math, Cambria Math, serif" font-size="35">u<tspan baseline-shift="sub" font-size="70%">t</tspan> = z<tspan baseline-shift="sub" font-size="70%">t</tspan> ⊙ ĥ<tspan baseline-shift="sub" font-size="70%">t−1</tspan></text>
<text x="1560" y="739" text-anchor="middle" fill="#142033" font-family="Times New Roman, STIX Two Math, Cambria Math, serif" font-size="35">+ (1 − z<tspan baseline-shift="sub" font-size="70%">t</tspan>) ⊙ n̂<tspan baseline-shift="sub" font-size="70%">t</tspan></text>
<text x="1560" y="792" text-anchor="middle" fill="#142033" font-family="Times New Roman, STIX Two Math, Cambria Math, serif" font-size="34">k<tspan baseline-shift="sub" font-size="70%">t</tspan> = Enc<tspan baseline-shift="sub" font-size="70%">5,h</tspan>(u<tspan baseline-shift="sub" font-size="70%">t</tspan>)</text>
<rect x="1870" y="485" width="360" height="300" rx="12" fill="#fbfdff" stroke="#003fbd" stroke-width="1.8"/>
<text x="2050" y="536" fill="#003fbd" font-size="33" font-weight="600" text-anchor="middle">读出与分数编码</text>
<text x="2050" y="595" text-anchor="middle" fill="#142033" font-family="Times New Roman, STIX Two Math, Cambria Math, serif" font-size="34">S<tspan baseline-shift="sub" font-size="70%">t</tspan> = Readout(k<tspan baseline-shift="sub" font-size="70%">t</tspan>)</text>
<text x="2050" y="648" text-anchor="middle" fill="#142033" font-family="Times New Roman, STIX Two Math, Cambria Math, serif" font-size="32">m<tspan baseline-shift="sub" font-size="70%">t</tspan> = max<tspan baseline-shift="sub" font-size="70%">j</tspan> S<tspan baseline-shift="sub" font-size="70%">t,j</tspan></text>
<text x="2050" y="701" text-anchor="middle" fill="#142033" font-family="Times New Roman, STIX Two Math, Cambria Math, serif" font-size="31">q<tspan baseline-shift="sub" font-size="70%">t,j</tspan> = E<tspan baseline-shift="sub" font-size="70%">5</tspan>(m<tspan baseline-shift="sub" font-size="70%">t</tspan> − S<tspan baseline-shift="sub" font-size="70%">t,j</tspan>)</text>
<text x="2050" y="757" fill="#627083" font-size="28" font-weight="400" text-anchor="middle">27类 × 5bit 分数码</text>
<text x="1048" y="105" text-anchor="middle" fill="#003fbd" font-family="Times New Roman, STIX Two Math, Cambria Math, serif" font-size="34">a<tspan baseline-shift="sub" font-size="70%">z</tspan>, b<tspan baseline-shift="sub" font-size="70%">z</tspan></text>
<text x="772" y="438" text-anchor="middle" fill="#003fbd" font-family="Times New Roman, STIX Two Math, Cambria Math, serif" font-size="30">a<tspan baseline-shift="sub" font-size="70%">r</tspan>, b<tspan baseline-shift="sub" font-size="70%">r</tspan></text>
<text x="775" y="620" text-anchor="middle" fill="#003fbd" font-family="Times New Roman, STIX Two Math, Cambria Math, serif" font-size="30">a<tspan baseline-shift="sub" font-size="70%">n</tspan>, b<tspan baseline-shift="sub" font-size="70%">n</tspan></text>
<text x="1072" y="466" text-anchor="start" fill="#003fbd" font-family="Times New Roman, STIX Two Math, Cambria Math, serif" font-size="35">r<tspan baseline-shift="sub" font-size="70%">t</tspan></text>
<text x="1601" y="480" text-anchor="start" fill="#003fbd" font-family="Times New Roman, STIX Two Math, Cambria Math, serif" font-size="35">z<tspan baseline-shift="sub" font-size="70%">t</tspan></text>
<text x="1284" y="595" text-anchor="middle" fill="#003fbd" font-family="Times New Roman, STIX Two Math, Cambria Math, serif" font-size="34">n̂<tspan baseline-shift="sub" font-size="70%">t</tspan></text>
<text x="1806" y="683" text-anchor="middle" fill="#003fbd" font-family="Times New Roman, STIX Two Math, Cambria Math, serif" font-size="32">k<tspan baseline-shift="sub" font-size="70%">t</tspan></text>
<text x="2245" y="608" text-anchor="middle" fill="#003fbd" font-family="Times New Roman, STIX Two Math, Cambria Math, serif" font-size="32">q<tspan baseline-shift="sub" font-size="70%">t</tspan></text>
<text x="960" y="902" text-anchor="middle" fill="#003fbd" font-family="Times New Roman, STIX Two Math, Cambria Math, serif" font-size="33">ĥ<tspan baseline-shift="sub" font-size="70%">t−1</tspan>：旧状态直接保留通路</text>
<text x="1820" y="964" fill="#003fbd" font-size="29" font-weight="400" text-anchor="middle">新状态编码</text>
<text x="1820" y="1004" fill="#627083" font-size="28" font-weight="400" text-anchor="middle">256 维 × 5bit</text>
<text x="2050" y="838" fill="#627083" font-size="27" font-weight="400" text-anchor="middle">电路外：解码与概率</text>
<text x="2050" y="880" text-anchor="middle" fill="#627083" font-family="Times New Roman, STIX Two Math, Cambria Math, serif" font-size="31">ℓ<tspan baseline-shift="sub" font-size="70%">t</tspan> = −G[q<tspan baseline-shift="sub" font-size="70%">t</tspan>]</text>
<text x="2050" y="924" text-anchor="middle" fill="#627083" font-family="Times New Roman, STIX Two Math, Cambria Math, serif" font-size="31">p<tspan baseline-shift="sub" font-size="70%">t</tspan> = Softmax(ℓ<tspan baseline-shift="sub" font-size="70%">t</tspan>)</text>
<path d="M45,1030 H2230" stroke="#d5dfeb" stroke-width="1.2"/>
<text x="45" y="1069" fill="#627083" font-size="26" font-weight="400" text-anchor="start">权重、偏置及主要数值码均5bit；Q₅按对应字段量化到32级。ĥ、n̂为码本值，k、q为编码；⊙为逐维乘法。</text>
<text x="45" y="1110" fill="#627083" font-size="26" font-weight="400" text-anchor="start">内部中间量仍≤8bit，与pipeline的W5S5-I8一致；Input / Recur / Readout包含原量化规则，融合公式不物化宽数值字。</text>
</g>
</svg>

